" y="184.695" width="420.258" height="71.398" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="62.224" y="197.762" fill="#000" font-size="13" textLength="41.952" font-weight="700">break</text><text x="149.175" y="196.906" fill="#000" font-size="11" textLength="302.307" font-weight="700">[réservation déjà commencée ou terminée — E1]</text><polygon points="74.224,244.094,64.224,248.094,74.224,252.094,70.224,248.094" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="68.224" y1="248.094" x2="410.38" y2="248.094" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="134.527" y="235.461" fill="#000" font-size="13" font-weight="700">3</text><text x="147.572" y="227.895" fill="#000" font-size="13" textLength="192.505">refus : annulation impossible,</text><text x="175.857" y="243.028" fill="#000" font-size="13" textLength="135.935">s'adresser à l'accueil</text><line x1="421.38" y1="306.359" x2="463.38" y2="306.359" style="stroke:#181818;stroke-width:1;"/><line x1="463.38" y1="306.359" x2="463.38" y2="319.359" style="stroke:#181818;stroke-width:1;"/><line x1="422.38" y1="319.359" x2="463.38" y2="319.359" style="stroke:#181818;stroke-width:1;"/><polygon points="432.38,315.359,422.38,319.359,432.38,323.359,428.38,319.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="428.38" y="293.727" fill="#000" font-size="13" font-weight="700">4</text><text x="441.426" y="286.161" fill="#000" font-size="13" textLength="277.735">appliquer la politique d'annulation (RG-10)</text><text x="462.621" y="301.293" fill="#000" font-size="13" textLength="235.346">selon le délai restant avant le début</text><polygon points="74.224,359.625,64.224,363.625,74.224,367.625,70.224,363.625" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="68.224" y1="363.625" x2="410.38" y2="363.625" style="stroke:#181818;s